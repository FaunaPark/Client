<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fauna Park</title>
    <link rel="stylesheet" href="../styles/output.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/main.js"></script>
    <link rel="icon" href="../../assets/favicon.ico" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body class="index">
    <div class="header">
        <div class="left">
            <img class=" h-36 " src="../../assets/logoHorizontal.png">
            <span
                class="text-7xl  font-serif bg-clip-text text-transparent bg-gradient-to-r from-green-800 to-orange-500">Fauna
                Park</span>
        </div>
        <div class="right">
            <button id="btnHabitats"
                class="px-6 py-4 rounded-xl bg-gradient-to-r from-green-800 to-orange-500 text-white font-semibold shadow-lg hover:scale-105 hover:shadow-xl active:scale-95 transition-all duration-300">
                <i class="fa-solid fa-mountain"></i> Hábitats</button>
            <button
                class="px-6 py-4 rounded-xl bg-gradient-to-r from-green-800 to-orange-500 text-white font-semibold shadow-lg hover:scale-105 hover:shadow-xl active:scale-95 transition-all duration-300">
                <i class="fa-solid fa-paw"></i> Animales</button>
        </div>
    </div>

    <div class="main">
        <h1 class="text-7xl text-center font-serif mt-6 text-gray-100">GESTION DEL PARQUE</h1>

        <div class="grid grid-cols-2 mt-11 mx-10 gap-8">
            <div class="aspect-[5/3]">
                <img id="leftImage" src="" class="w-full h-full object-cover filter grayscale hover:grayscale-0 transition-all duration-700 hover:scale-105">
            </div>
            <div class="aspect-[5/3]">
                <img id="rightImage" src="" class="w-full h-full object-cover filter grayscale hover:grayscale-0 transition-all duration-700 hover:scale-105">
            </div>
        </div>
    </div>

    <div class="footer">
        <h1 class="text-7xl text-center my-8">Footer</h1>
    </div>


</body>

</html>
