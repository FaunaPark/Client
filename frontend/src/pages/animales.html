<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fauna Park</title>
    <link rel="stylesheet" href="../styles/output.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/main.js"></script>
    <link rel="icon" href="../../assets/favicon.ico" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="animales">
    <div class="header">
        <div class="left">
            <img id="logo" class=" h-36 hover:scale-105 active:scale-95 transition-all duration-300 "
                src="../../assets/logoHorizontal.png">
            <span
                class="text-7xl  font-serif bg-clip-text text-transparent bg-gradient-to-r from-green-800 to-orange-500">Fauna
                Park</span>
        </div>
        <div class="right">
            <button id="btnAñadir"
                class="px-6 py-4 rounded-xl bg-gradient-to-r from-green-800 to-orange-500 text-white font-semibold shadow-lg hover:scale-105 hover:shadow-xl active:scale-95 transition-all duration-300">
                <i class="fa-solid fa-plus"></i> Añadir</button>
            <button id="btnEditar"
                class="px-6 py-4 rounded-xl bg-gradient-to-r from-green-800 to-orange-500 text-white font-semibold shadow-lg hover:scale-105 hover:shadow-xl active:scale-95 transition-all duration-300">
                <i class="fa-solid fa-pen-to-square"></i> Editar</button>
            <button id="btnEliminar"
                class="px-6 py-4 rounded-xl bg-gradient-to-r from-green-800 to-orange-500 text-white font-semibold shadow-lg hover:scale-105 hover:shadow-xl active:scale-95 transition-all duration-300">
                <i class="fa-solid fa-trash-can"></i> Eliminar</button>
        </div>
    </div>

    <div class="main px-10 py-6">
        <h1 class="text-7xl text-center font-serif mt-6 text-gray-100">ANIMALES DEL PARQUE</h1><BR>

        <!-- Banner modo edición -->
        <div id="bannerEdicion" class="banner-edicion hidden">
            <p class="text-xl font-semibold">🔧 Modo Edición Activado - Haz clic en un animal para editarlo</p>
            <button id="btnCancelarModoEdicion" class="btn-cancelar-modo">Cancelar Modo Edición</button>
        </div>

        <div class="mb-6 flex justify-center">
            <div class="relative w-full max-w-md">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><i
                        class="fa-solid fa-magnifying-glass"></i></span>

                <input type="text" id="searchAnimal" placeholder="Buscar animal por especie..."
                    class="w-full pl-10 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none">
            </div>
        </div>
        <div id="animalList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
        </div>

    </div>

    <!-- Formulario para añadir animal -->
    <div id="formularioAñadir" class="formulario-overlay hidden">
        <div class="formulario-contenido">
            <div class="formulario-cabecera">
                <h2 class="text-3xl font-bold text-gray-800">Añadir Nuevo Animal</h2>
                <button id="btnCerrarFormulario" class="text-gray-500 hover:text-gray-800 text-3xl"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="formAñadirAnimal" class="formulario-cuerpo">
                <div class="form-grupo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-grupo">
                    <label for="especie">Especie</label>
                    <input type="text" id="especie" name="especie" required>
                </div>

                <div class="form-grupo">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="Mamífero">Mamífero</option>
                        <option value="Ave">Ave</option>
                        <option value="Reptil">Reptil</option>
                        <option value="Anfibio">Anfibio</option>
                        <option value="Pez">Pez</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="edad">Edad (años)</label>
                    <input type="number" id="edad" name="edad" min="0" required>
                </div>

                <div class="form-grupo">
                    <label for="estado_salud">Estado de Salud</label>
                    <select id="estado_salud" name="estado_salud" required>
                        <option value="">Selecciona un estado</option>
                        <option value="Saludable">Saludable</option>
                        <option value="Requiere atención">Requiere Atención</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="habitat_id">Hábitat</label>
                    <select id="habitat_id" name="habitat_id" required>
                        <option value="">Selecciona un hábitat</option>
                        <!-- Se cargará dinámicamente desde la API -->
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="imagen_url">URL de Imagen</label>
                    <input type="url" id="imagen_url" name="imagen_url" placeholder="https://ejemplo.com/imagen.jpg"
                        required>
                </div>

                <div class="form-grupo">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="3" required></textarea>
                </div>

                <div class="formulario-pie">
                    <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario">Guardar Animal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Formulario para editar animal -->
    <div id="formularioEditar" class="formulario-overlay hidden">
        <div class="formulario-contenido">
            <div class="formulario-cabecera">
                <h2 class="text-3xl font-bold text-gray-800">Editar Animal</h2>
                <button id="btnCerrarFormularioEditar" class="text-gray-500 hover:text-gray-800 text-3xl"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="formEditarAnimal" class="formulario-cuerpo">
                <input type="hidden" id="editar_id">

                <div class="form-grupo">
                    <label for="editar_nombre">Nombre</label>
                    <input type="text" id="editar_nombre" name="nombre" required>
                </div>

                <div class="form-grupo">
                    <label for="editar_especie">Especie</label>
                    <input type="text" id="editar_especie" name="especie" required>
                </div>

                <div class="form-grupo">
                    <label for="editar_categoria">Categoría</label>
                    <select id="editar_categoria" name="categoria" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="Mamífero">Mamífero</option>
                        <option value="Ave">Ave</option>
                        <option value="Reptil">Reptil</option>
                        <option value="Anfibio">Anfibio</option>
                        <option value="Pez">Pez</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="editar_edad">Edad (años)</label>
                    <input type="number" id="editar_edad" name="edad" min="0" required>
                </div>

                <div class="form-grupo">
                    <label for="editar_estado_salud">Estado de Salud</label>
                    <select id="editar_estado_salud" name="estado_salud" required>
                        <option value="">Selecciona un estado</option>
                        <option value="Saludable">Saludable</option>
                        <option value="Requiere atención">Requiere Atención</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="editar_habitat_id">Hábitat</label>
                    <select id="editar_habitat_id" name="habitat_id" required>
                        <option value="">Selecciona un hábitat</option>
                        <!-- Se cargará dinámicamente desde la API -->
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="editar_imagen_url">URL de Imagen</label>
                    <input type="url" id="editar_imagen_url" name="imagen_url"
                        placeholder="https://ejemplo.com/imagen.jpg" required>
                </div>

                <div class="form-grupo">
                    <label for="editar_descripcion">Descripción</label>
                    <textarea id="editar_descripcion" name="descripcion" rows="3" required></textarea>
                </div>

                <div class="formulario-pie">
                    <button type="button" id="btnCancelarEditar" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario">Actualizar Animal</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        <h1 class="text-7xl text-center my-8">Footer</h1>
    </div>
</body>

</html>
