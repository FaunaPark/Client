<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fauna Park</title>
    <link rel="stylesheet" href="../styles/output.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/main.js"></script>
    <link rel="icon" href="../../assets/favicon.ico" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="animales">
    <div class="header">
        <div class="left">
            <img class=" h-36 " src="../../assets/logoHorizontal.png">
            <span
                class="text-7xl  font-serif bg-clip-text text-transparent bg-gradient-to-r from-green-800 to-orange-500">Fauna
                Park</span>
        </div>
        <div class="right">
            <button id="btnAñadir"
                class="px-6 py-4 rounded-xl bg-gradient-to-r from-green-800 to-orange-500 text-white font-semibold shadow-lg hover:scale-105 hover:shadow-xl active:scale-95 transition-all duration-300">
                <i class="fa-solid fa-plus"></i> Añadir</button>
            <button id="btnEditar"
                class="px-6 py-4 rounded-xl bg-gradient-to-r from-green-800 to-orange-500 text-white font-semibold shadow-lg hover:scale-105 hover:shadow-xl active:scale-95 transition-all duration-300">
                <i class="fa-solid fa-pen-to-square"></i> Editar</button>
        </div>
    </div>

    <div class="main px-10 py-6">
        <h1 class="text-7xl text-center font-serif mt-6 text-gray-100">ANIMALES DEL PARQUE</h1><BR>

        <div class="mb-6 flex justify-center">
            <div class="relative w-full max-w-md">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                
                <input type="text" id="searchAnimal" placeholder="Buscar animal..."
                    class="w-full pl-10 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none">
            </div>
        </div>

    </div>

    <div class="footer">
        <h1 class="text-7xl text-center my-8">Footer</h1>
    </div>
</body>
</html>
